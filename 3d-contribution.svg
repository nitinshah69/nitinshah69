      <polygon points="20,22 32,16 32,26 20,32" fill="#181818"/>
      <!-- Col 2 -->
      <polygon points="60,10 72,16 60,22 48,16" fill="url(#pillar-low-top)"/>
      <polygon points="48,16 60,22 60,32 48,26" fill="url(#pillar-low-side)"/>
