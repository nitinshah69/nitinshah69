      <polygon points="408,16 420,22 420,32 408,26" fill="url(#pillar-low-side)"/>
      <polygon points="420,22 432,16 432,32 420,32" fill="#181818"/>
      <!-- Col 12 -->
      <polygon points="460,-14 472,-8 460,-2 448,-8" fill="url(#pillar-hi-top)"/>
      <polygon points="448,-8 460,-2 460,35 448,29" fill="url(#pillar-hi-side)"/>
      <polygon points="460,-2 472,-8 472,29 460,35" fill="#993806"/>
      <!-- Col 13 -->
      <polygon points="500,5 512,11 500,17 488,11" fill="url(#pillar-med-top)"/>
      <polygon points="488,11 500,17 500,35 488,29" fill="url(#pillar-med-side)"/>
      <polygon points="500,17 512,11 512,29 500,35" fill="#3D1807"/>
      <!-- Col 14 -->
