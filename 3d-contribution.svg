  <!-- Legend -->
  <g transform="translate(730, 205)">
    <circle cx="0" cy="0" r="3" fill="#2A2A2A"/>
    <text x="8" y="3.5" fill="#555555" font-size="8.5" class="font-mono">LOW</text>
    
    <circle cx="45" cy="0" r="3" fill="#9E3E12"/>
    <text x="53" y="3.5" fill="#777777" font-size="8.5" class="font-mono">MED</text>

    <circle cx="90" cy="0" r="3" fill="#FF6A1F"/>
    <text x="98" y="3.5" fill="#FF6A1F" font-size="8.5" font-weight="700" class="font-mono">HIGH</text>
