<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="c3d-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>

    <!-- Isometric Pillar Gradients -->
    <!-- Base / Low Activity Pillar -->
    <linearGradient id="pillar-low-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#2A2A2A"/>
    </linearGradient>
    <linearGradient id="pillar-low-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </linearGradient>

    <!-- Medium Activity Pillar -->
    <linearGradient id="pillar-med-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#732E0E"/>
      <stop offset="100%" stop-color="#9E3E12"/>
    </linearGradient>
    <linearGradient id="pillar-med-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54210A"/>
      <stop offset="100%" stop-color="#331406"/>
    </linearGradient>

    <!-- High Activity Pillar (Active Orange Glow) -->
    <linearGradient id="pillar-hi-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1F"/>
      <stop offset="100%" stop-color="#FFA066"/>
    </linearGradient>
    <linearGradient id="pillar-hi-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC4D0C"/>
      <stop offset="100%" stop-color="#802E05"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="920" height="240" rx="10" fill="url(#c3d-bg)"/>
  <rect width="918" height="238" x="1" y="1" rx="9" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- Top Title Bar -->
  <g transform="translate(35, 30)">
    <text x="0" y="0" fill="#F5F5F0" font-size="12" font-weight="700" letter-spacing="1.5" class="font-mono">3D CONTRIBUTION TOPOGRAPHY // INTENSITY MATRIX</text>
    <text x="850" y="0" text-anchor="end" fill="#666666" font-size="9.5" class="font-mono">ISOMETRIC RENDER</text>
  </g>

