<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="focus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      @keyframes focusPulse {
        0%, 100% { opacity: 0.5; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 3px #FF6A1F); }
      }

      .pulse-dot {
        animation: focusPulse 3s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="960" height="90" rx="8" fill="url(#focus-bg)"/>
  <rect width="958" height="88" x="1" y="1" rx="7" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- 5 Horizontal Modules -->
  <!-- Item 1: AI & AGENTIC -->
  <g transform="translate(25, 22)">
    <rect width="170" height="46" rx="5" fill="#151515" stroke="#242424"/>
    <line x1="0" y1="0" x2="0" y2="46" stroke="#FF6A1F" stroke-width="3"/>
    <circle cx="16" cy="18" r="3.5" fill="#FF6A1F" class="pulse-dot"/>
    <text x="26" y="21" fill="#F4F1EA" font-size="10.5" font-weight="700" class="font-mono">AI &amp; AGENTIC</text>
    <text x="16" y="36" fill="#8A8A8A" font-size="8.5" class="font-mono">LangGraph · RAG</text>
  </g>

  <!-- Item 2: FULL-STACK PRODUCTS -->
  <g transform="translate(210, 22)">
    <rect width="170" height="46" rx="5" fill="#151515" stroke="#242424"/>
    <line x1="0" y1="0" x2="0" y2="46" stroke="#FF6A1F" stroke-width="3"/>
    <circle cx="16" cy="18" r="3.5" fill="#FF6A1F" class="pulse-dot"/>
    <text x="26" y="21" fill="#F4F1EA" font-size="10.5" font-weight="700" class="font-mono">FULL-STACK APPS</text>
    <text x="16" y="36" fill="#8A8A8A" font-size="8.5" class="font-mono">Next.js 14 · Cloud</text>
  </g>

  <!-- Item 3: SYSTEM ARCHITECTURE -->
  <g transform="translate(395, 22)">
    <rect width="170" height="46" rx="5" fill="#151515" stroke="#242424"/>
    <line x1="0" y1="0" x2="0" y2="46" stroke="#FF6A1F" stroke-width="3"/>
    <circle cx="16" cy="18" r="3.5" fill="#FF6A1F" class="pulse-dot"/>
    <text x="26" y="21" fill="#F4F1EA" font-size="10.5" font-weight="700" class="font-mono">SYSTEM DESIGN</text>
    <text x="16" y="36" fill="#8A8A8A" font-size="8.5" class="font-mono">Low Latency · SQL</text>
  </g>

  <!-- Item 4: CLEAN CODE -->
  <g transform="translate(580, 22)">
    <rect width="170" height="46" rx="5" fill="#151515" stroke="#242424"/>
    <line x1="0" y1="0" x2="0" y2="46" stroke="#FF6A1F" stroke-width="3"/>
    <circle cx="16" cy="18" r="3.5" fill="#FF6A1F" class="pulse-dot"/>
    <text x="26" y="21" fill="#F4F1EA" font-size="10.5" font-weight="700" class="font-mono">CLEAN CODE</text>
    <text x="16" y="36" fill="#8A8A8A" font-size="8.5" class="font-mono">Type-Safe · Modular</text>
  </g>

  <!-- Item 5: USER EXPERIENCE -->
  <g transform="translate(765, 22)">
    <rect width="170" height="46" rx="5" fill="#151515" stroke="#242424"/>
    <line x1="0" y1="0" x2="0" y2="46" stroke="#FF6A1F" stroke-width="3"/>
    <circle cx="16" cy="18" r="3.5" fill="#FF6A1F" class="pulse-dot"/>
    <text x="26" y="21" fill="#F4F1EA" font-size="10.5" font-weight="700" class="font-mono">USER EXPERIENCE</text>
    <text x="16" y="36" fill="#8A8A8A" font-size="8.5" class="font-mono">Motion · Precision</text>
  </g>
</svg>
