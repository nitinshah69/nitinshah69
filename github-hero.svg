<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Palette: #080808 to #151515 -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="60%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>

    <!-- The Intelligent Orange Thread Gradient (#FF6A1F to #FF7A26) -->
    <linearGradient id="orange-thread-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1F" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#FF6A1F" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#FF7A26" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF6A1F" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Metallic 3D Facet Shading -->
    <linearGradient id="facet-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#2D2D2D"/>
    </linearGradient>
    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </linearGradient>

    <!-- Fine Technical Architectural Grid -->
    <pattern id="arch-grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A1A1A" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="0.8" fill="#333333" opacity="0.6"/>
    </pattern>

    <!-- Soft Orange Studio Glow Filter -->
    <filter id="orange-ambient-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }

      /* Animation 1: Orange Thread Drawing Continuously */
      @keyframes threadTravel {
        0% { stroke-dashoffset: 1400; }
        100% { stroke-dashoffset: 0; }
      }

      /* Animation 2: Slow 3D Metallic Ring Rotation */
      @keyframes slowRingRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Animation 3: Subtle 3D Monolith Floating */
      @keyframes monolithFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }

      /* Animation 4: Target Beacon & Micro Pulse */
      @keyframes targetPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #FF6A1F); opacity: 0.85; }
        50% { transform: scale(1.35); filter: drop-shadow(0 0 10px #FF7A26); opacity: 1; }
      }

      @keyframes statusBlink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      .path-drawing {
        stroke-dasharray: 260 600;
        animation: threadTravel 6.5s linear infinite;
      }

      .floating-3d-node {
        animation: monolithFloat 5s ease-in-out infinite;
      }

      .rotating-ring {
        animation: slowRingRotate 28s linear infinite;
        transform-origin: 880px 105px;
      }

      .target-beacon {
        animation: targetPulse 2.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .live-indicator {
        animation: statusBlink 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Plate -->
  <rect width="960" height="320" rx="12" fill="url(#hero-bg)"/>
  <rect width="960" height="320" rx="12" fill="url(#arch-grid-pattern)"/>
  <rect width="958" height="318" x="1" y="1" rx="11" fill="none" stroke="#242424" stroke-width="1.2"/>

  <!-- Top System Bar -->
  <g transform="translate(45, 34)">
    <circle cx="6" cy="0" r="4.5" fill="#FF6A1F" class="target-beacon"/>
    <circle cx="6" cy="0" r="1.8" fill="#FFFFFF"/>
    <text x="20" y="4" fill="#8A8A8A" font-size="10.5" font-weight="600" letter-spacing="1.5" class="font-mono">NITIN SHAH // SYSTEMS &amp; AI LABS</text>
    <text x="870" y="4" text-anchor="end" fill="#8A8A8A" font-size="9.5" letter-spacing="1.2" class="font-mono">SYS.VER: 2026.PRO</text>
  </g>

  <!-- Divider Line -->
  <line x1="45" y1="52" x2="915" y2="52" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ==================== LEFT SIDE: TYPOGRAPHY & TECHNICAL LABELS ==================== -->
  <g transform="translate(48, 105)">
    <!-- Primary Identity -->
    <text x="0" y="0" fill="#F4F1EA" font-size="34" font-weight="700" letter-spacing="-0.5" class="font-sans">NITIN SHAH</text>
    
    <!-- Subtitle Line -->
    <text x="0" y="24" fill="#FF6A1F" font-size="12.5" font-weight="700" letter-spacing="1.8" class="font-mono">AI / FULL-STACK DEVELOPER</text>
    
    <!-- Positioning Statement -->
    <text x="0" y="52" fill="#8A8A8A" font-size="13" font-weight="400" letter-spacing="0.2" class="font-sans">
      Building intelligent products, modern web systems, and AI-powered experiences.
    </text>

    <!-- Compact Technical Labels Row 1: Disciplines -->
    <g transform="translate(0, 82)">
      <rect width="115" height="22" rx="4" fill="#151515" stroke="#242424"/>
      <text x="57" y="14" text-anchor="middle" fill="#F4F1EA" font-size="9" font-weight="600" letter-spacing="0.8" class="font-mono">AI ENGINEERING</text>

      <rect x="122" width="95" height="22" rx="4" fill="#151515" stroke="#242424"/>
      <text x="169" y="14" text-anchor="middle" fill="#F4F1EA" font-size="9" font-weight="600" letter-spacing="0.8" class="font-mono">FULL STACK</text>

      <rect x="224" width="70" height="22" rx="4" fill="#151515" stroke="#242424"/>
      <text x="259" y="14" text-anchor="middle" fill="#F4F1EA" font-size="9" font-weight="600" letter-spacing="0.8" class="font-mono">GEN AI</text>

      <rect x="301" width="115" height="22" rx="4" fill="#151515" stroke="#242424"/>
      <text x="358" y="14" text-anchor="middle" fill="#F4F1EA" font-size="9" font-weight="600" letter-spacing="0.8" class="font-mono">SYSTEM DESIGN</text>
    </g>

    <!-- Compact Technical Labels Row 2: Core Stack -->
    <g transform="translate(0, 112)">
      <rect width="78" height="22" rx="4" fill="#151515" stroke="#242424"/>
      <text x="39" y="14" text-anchor="middle" fill="#8A8A8A" font-size="9" font-weight="600" letter-spacing="0.8" class="font-mono">NEXT.JS</text>

      <rect x="85" width="68" height="22" rx="4" fill="#151515" stroke="#242424"/>
      <text x="119" y="14" text-anchor="middle" fill="#8A8A8A" font-size="9" font-weight="600" letter-spacing="0.8" class="font-mono">REACT</text>

      <rect x="160" width="80" height="22" rx="4" fill="#151515" stroke="#242424"/>
      <text x="200" y="14" text-anchor="middle" fill="#8A8A8A" font-size="9" font-weight="600" letter-spacing="0.8" class="font-mono">NODE.JS</text>

      <rect x="247" width="75" height="22" rx="4" fill="#151515" stroke="#242424"/>
      <text x="284" y="14" text-anchor="middle" fill="#8A8A8A" font-size="9" font-weight="600" letter-spacing="0.8" class="font-mono">PYTHON</text>

      <rect x="329" width="87" height="22" rx="4" fill="#181410" stroke="#FF6A1F" stroke-width="1.2"/>
      <circle cx="341" cy="11" r="3" fill="#FF6A1F" class="live-indicator"/>
      <text x="375" y="14" text-anchor="middle" fill="#FF7A26" font-size="9" font-weight="700" letter-spacing="0.8" class="font-mono">ONLINE</text>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE: THE INTELLIGENT THREAD & 3D INDUSTRIAL NODES ==================== -->
  <g transform="translate(0, 0)">
    <!-- Wireframe Architectural Guide Curves -->
    <path d="M 480 250 C 580 250, 620 180, 720 180 C 800 180, 830 110, 880 105" 
          fill="none" stroke="#161616" stroke-width="2"/>
    <path d="M 520 280 C 620 280, 660 210, 760 210 C 820 210, 840 140, 880 105" 
          fill="none" stroke="#141414" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Active Animated Intelligent Orange Thread -->
    <path d="M 480 250 C 580 250, 620 180, 720 180 C 800 180, 830 110, 880 105" 
          fill="none" stroke="url(#orange-thread-grad)" stroke-width="2.5" stroke-linecap="round" class="path-drawing" filter="url(#orange-ambient-glow)"/>

    <!-- Node 1: CODE (480, 250) -->
    <g transform="translate(480, 250)">
      <circle cx="0" cy="0" r="5" fill="#080808" stroke="#FF6A1F" stroke-width="2"/>
      <circle cx="0" cy="0" r="2" fill="#FF6A1F"/>
      <text x="0" y="18" text-anchor="middle" fill="#8A8A8A" font-size="8.5" font-weight="700" letter-spacing="1" class="font-mono">CODE</text>
    </g>

    <!-- Node 2: BUILD with 3D Monolith (610, 215) -->
    <g transform="translate(610, 215)" class="floating-3d-node">
      <!-- 3D Metallic Isometric Monolith -->
      <polygon points="0,-18 16,-9 0,0 -16,-9" fill="url(#facet-top)" stroke="#333333" stroke-width="0.8"/>
      <polygon points="-16,-9 0,0 0,20 -16,11" fill="url(#facet-left)" stroke="#222222" stroke-width="0.8"/>
      <polygon points="0,0 16,-9 16,11 0,20" fill="url(#facet-right)" stroke="#222222" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FF6A1F" stroke-width="1.2"/>
      <text x="0" y="34" text-anchor="middle" fill="#8A8A8A" font-size="8.5" font-weight="700" letter-spacing="1" class="font-mono">BUILD</text>
    </g>

    <!-- Node 3: SHIP with Wireframe Geometric Ring (745, 175) -->
    <g transform="translate(745, 175)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#262626" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="6" fill="#080808" stroke="#FF6A1F" stroke-width="2"/>
      <circle cx="0" cy="0" r="2.5" fill="#FF7A26"/>
      <text x="0" y="-18" text-anchor="middle" fill="#8A8A8A" font-size="8.5" font-weight="700" letter-spacing="1" class="font-mono">SHIP</text>
    </g>

    <!-- Node 4: EVOLVE (Target Destination: 880, 105) -->
    <g transform="translate(880, 105)">
      <!-- Outer Rotating Orbital Ring -->
      <g class="rotating-ring">
        <circle cx="0" cy="0" r="26" fill="none" stroke="#2D2D2D" stroke-width="1" stroke-dasharray="5 5"/>
        <circle cx="26" cy="0" r="2.5" fill="#FF6A1F"/>
      </g>
      
      <!-- Target Beacon Center (EVOLVE) -->
      <circle cx="0" cy="0" r="10" fill="#151515" stroke="#FF6A1F" stroke-width="2.5" class="target-beacon" filter="url(#orange-ambient-glow)"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
      
      <!-- Label -->
      <text x="0" y="-34" text-anchor="middle" fill="#FF7A26" font-size="10" font-weight="700" letter-spacing="1.5" class="font-mono">EVOLVE</text>
    </g>
  </g>

  <!-- Bottom Technical Coordinate Stamp -->
  <g transform="translate(915, 298)">
    <text x="0" y="0" text-anchor="end" fill="#555555" font-size="9" letter-spacing="1.2" class="font-mono">LAT 28.6139° N · LON 77.2090° E // PRODUCTION ARCHITECTURE</text>
  </g>
</svg>
