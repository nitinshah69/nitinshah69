<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>

    <linearGradient id="thread-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1F" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FF6A1F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFA066" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF6A1F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF6A1F" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#242424" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <filter id="orange-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      
      @keyframes pulseDot {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); }
      }

      @keyframes drawPath {
        0% { stroke-dashoffset: 1400; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes travelGlow {
        0% { offset-distance: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }

      @keyframes revealText {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .pulse-indicator {
        animation: pulseDot 3s ease-in-out infinite;
        transform-origin: 48px 38px;
      }

      .animated-path {
        stroke-dasharray: 200 600;
        animation: drawPath 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .node-pulse {
        animation: pulseDot 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Surface -->
  <rect width="900" height="320" rx="14" fill="url(#bg-grad)"/>
  <rect width="900" height="320" rx="14" fill="url(#grid)"/>
  <rect width="898" height="318" x="1" y="1" rx="13" fill="none" stroke="#242424" stroke-width="1.2"/>

  <!-- Top System Status Bar -->
  <g transform="translate(40, 38)">
    <circle cx="8" cy="0" r="4" fill="#FF6A1F" class="pulse-indicator" filter="url(#orange-glow)"/>
    <circle cx="8" cy="0" r="2" fill="#FFFFFF"/>
    <text x="22" y="4" fill="#A1A1A1" font-size="11" font-weight="600" letter-spacing="1.5" class="font-mono">NITIN SHAH // SYSTEMS &amp; AI LABS</text>
    <text x="820" y="4" text-anchor="end" fill="#666666" font-size="10" letter-spacing="1.2" class="font-mono">EST. 2026</text>
  </g>

  <!-- Divider Line -->
  <line x1="40" y1="58" x2="860" y2="58" stroke="#1F1F1F" stroke-width="1"/>

  <!-- Intelligent Pipeline Thread (Background Track) -->
  <path d="M 60 170 C 180 170, 200 115, 310 115 C 420 115, 450 205, 570 205 C 680 205, 730 145, 840 145" 
        fill="none" stroke="#1E1E1E" stroke-width="2"/>

  <!-- Animated Active Thread -->
  <path d="M 60 170 C 180 170, 200 115, 310 115 C 420 115, 450 205, 570 205 C 680 205, 730 145, 840 145" 
        fill="none" stroke="url(#thread-grad)" stroke-width="2.5" stroke-linecap="round" class="animated-path" filter="url(#orange-glow)"/>

  <!-- Node 1: BUILD -->
  <g transform="translate(60, 170)">
    <circle cx="0" cy="0" r="5" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="2"/>
    <circle cx="0" cy="0" r="2" fill="#FF6A1F"/>
    <text x="0" y="-14" text-anchor="middle" fill="#A1A1A1" font-size="9.5" font-weight="700" letter-spacing="1.2" class="font-mono">01 BUILD</text>
  </g>

  <!-- Node 2: LEARN -->
  <g transform="translate(310, 115)">
    <circle cx="0" cy="0" r="5" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="2"/>
    <circle cx="0" cy="0" r="2" fill="#FF6A1F"/>
    <text x="0" y="-14" text-anchor="middle" fill="#A1A1A1" font-size="9.5" font-weight="700" letter-spacing="1.2" class="font-mono">02 LEARN</text>
  </g>

  <!-- Node 3: EXPERIMENT -->
  <g transform="translate(570, 205)">
    <circle cx="0" cy="0" r="5" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="2"/>
    <circle cx="0" cy="0" r="2" fill="#FF6A1F"/>
    <text x="0" y="24" text-anchor="middle" fill="#A1A1A1" font-size="9.5" font-weight="700" letter-spacing="1.2" class="font-mono">03 EXPERIMENT</text>
  </g>

  <!-- Node 4: SHIP -->
  <g transform="translate(840, 145)">
    <circle cx="0" cy="0" r="6" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="2" filter="url(#orange-glow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    <text x="0" y="-16" text-anchor="middle" fill="#F5F5F0" font-size="9.5" font-weight="700" letter-spacing="1.2" class="font-mono">04 SHIP</text>
  </g>

  <!-- Primary Identity Presentation -->
  <g transform="translate(60, 240)">
    <text x="0" y="0" fill="#F5F5F0" font-size="28" font-weight="700" letter-spacing="-0.5" class="font-sans">NITIN SHAH</text>
    <text x="195" y="-3" fill="#FF6A1F" font-size="12" font-weight="700" letter-spacing="1.5" class="font-mono">/ AI &amp; FULL-STACK SYSTEMS</text>
    
    <text x="0" y="26" fill="#A1A1A1" font-size="13" font-weight="400" letter-spacing="0.2" class="font-sans">
      Building intelligent web applications, agentic workflows, and high-performance production systems.
    </text>
  </g>

  <!-- Bottom Coordinate / Spec Tag -->
  <g transform="translate(840, 280)">
    <text x="0" y="0" text-anchor="end" fill="#444444" font-size="9.5" letter-spacing="1" class="font-mono">LAT: 28.6139° N / LON: 77.2090° E</text>
  </g>
</svg>
