<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="orbit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      @keyframes orbitRotateSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .orbiting-track {
        animation: orbitRotateSlow 40s linear infinite;
        transform-origin: 250px 130px;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="500" height="260" rx="10" fill="url(#orbit-bg)"/>
  <rect width="498" height="258" x="1" y="1" rx="9" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- Orbit Ellipses -->
  <ellipse cx="250" cy="130" rx="170" ry="75" fill="none" stroke="#222222" stroke-width="1" stroke-dasharray="3 3"/>
  <ellipse cx="250" cy="130" rx="110" ry="50" fill="none" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Center Hub: BUILD -->
  <g transform="translate(250, 130)">
    <circle cx="0" cy="0" r="28" fill="#141414" stroke="#FF6A1F" stroke-width="1.8"/>
    <text x="0" y="3.5" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="1" class="font-mono">BUILD</text>
  </g>

  <!-- Rotating Orbit Layer: 1 Orange Accent Node (AI), Others Grayscale -->
  <g class="orbiting-track">
    <!-- Node 1: React (Angle 0) -->
    <g transform="translate(420, 130)">
      <circle cx="0" cy="0" r="14" fill="#161616" stroke="#333333"/>
      <text x="0" y="3" text-anchor="middle" fill="#A1A1A1" font-size="8" font-weight="600" class="font-mono">React</text>
    </g>

    <!-- Node 2: Python (Angle 60) -->
    <g transform="translate(335, 195)">
      <circle cx="0" cy="0" r="14" fill="#161616" stroke="#333333"/>
      <text x="0" y="3" text-anchor="middle" fill="#A1A1A1" font-size="7.5" font-weight="600" class="font-mono">Python</text>
    </g>

    <!-- Node 3: Node (Angle 120) -->
    <g transform="translate(165, 195)">
      <circle cx="0" cy="0" r="14" fill="#161616" stroke="#333333"/>
      <text x="0" y="3" text-anchor="middle" fill="#A1A1A1" font-size="8" font-weight="600" class="font-mono">Node</text>
    </g>

    <!-- Node 4: AI / GenAI (Angle 180 - THE SINGLE ORANGE ACCENT NODE) -->
    <g transform="translate(80, 130)">
      <circle cx="0" cy="0" r="16" fill="#141414" stroke="#FF6A1F" stroke-width="2"/>
      <text x="0" y="3.5" text-anchor="middle" fill="#FF6A1F" font-size="9" font-weight="700" class="font-mono">AI</text>
    </g>

    <!-- Node 5: SQL (Angle 240) -->
    <g transform="translate(165, 65)">
      <circle cx="0" cy="0" r="14" fill="#161616" stroke="#333333"/>
      <text x="0" y="3" text-anchor="middle" fill="#A1A1A1" font-size="8" font-weight="600" class="font-mono">SQL</text>
    </g>

    <!-- Node 6: Docker (Angle 300) -->
    <g transform="translate(335, 65)">
      <circle cx="0" cy="0" r="14" fill="#161616" stroke="#333333"/>
      <text x="0" y="3" text-anchor="middle" fill="#A1A1A1" font-size="7.5" font-weight="600" class="font-mono">Docker</text>
    </g>
  </g>

  <!-- Spec Tag -->
  <text x="250" y="245" text-anchor="middle" fill="#555555" font-size="8.5" letter-spacing="1.5" class="font-mono">TECHNOLOGY ORBIT // DISCIPLINED REVOLUTION</text>
</svg>
