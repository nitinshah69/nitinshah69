<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>

    <linearGradient id="p1-sparkline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1F" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FF6A1F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF7A26" stop-opacity="0.8"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      @keyframes streamTravel1 {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes beacon1 {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #FF6A1F); }
        50% { transform: scale(1.3); filter: drop-shadow(0 0 7px #FF7A26); }
      }

      .sparkline-stream {
        stroke-dasharray: 100 250;
        animation: streamTravel1 4s linear infinite;
      }

      .p1-beacon {
        animation: beacon1 2.5s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="960" height="220" rx="10" fill="url(#p1-bg)"/>
  <rect width="958" height="218" x="1" y="1" rx="9" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- Left: Metadata & Architecture Notes -->
  <g transform="translate(40, 42)">
    <rect width="130" height="22" rx="4" fill="#181410" stroke="#FF6A1F" stroke-width="1.2"/>
    <text x="65" y="15" text-anchor="middle" fill="#FF7A26" font-size="9" font-weight="700" letter-spacing="1" class="font-mono">PRODUCTION SAAS</text>

    <text x="0" y="52" fill="#F4F1EA" font-size="18" font-weight="700" class="font-sans">AambaaLabs E-Commerce Infrastructure</text>
    <text x="0" y="78" fill="#8A8A8A" font-size="12" class="font-sans">Real-time inventory synchronization, order dispatch telemetry, and automated billing engine.</text>

    <!-- Metrics Row -->
    <g transform="translate(0, 110)">
      <text x="0" y="0" fill="#FF7A26" font-size="15" font-weight="700" class="font-mono">&lt; 120ms</text>
      <text x="0" y="18" fill="#666666" font-size="9" class="font-mono">MUTATION LATENCY</text>

      <text x="120" y="0" fill="#F4F1EA" font-size="15" font-weight="700" class="font-mono">99.98%</text>
      <text x="120" y="18" fill="#666666" font-size="9" class="font-mono">SYNC ACCURACY</text>

      <text x="240" y="0" fill="#F4F1EA" font-size="15" font-weight="700" class="font-mono">FIREBASE</text>
      <text x="240" y="18" fill="#666666" font-size="9" class="font-mono">FIRESTORE BACKEND</text>
    </g>
  </g>

  <!-- Right: Real-time Telemetry Sparkline & Graph UI -->
  <g transform="translate(560, 35)">
    <rect width="360" height="150" rx="8" fill="#121212" stroke="#222222"/>
    <text x="18" y="24" fill="#8A8A8A" font-size="9.5" font-weight="600" class="font-mono">REAL-TIME INVENTORY STREAM (SYNC ENGINE)</text>
    <circle cx="340" cy="20" r="3.5" fill="#FF6A1F" class="p1-beacon"/>

    <!-- Grid Lines -->
    <line x1="18" y1="45" x2="342" y2="45" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="18" y1="80" x2="342" y2="80" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="18" y1="115" x2="342" y2="115" stroke="#1A1A1A" stroke-width="1"/>

    <!-- Static Sparkline Trace -->
    <path d="M 20 120 Q 60 100, 100 110 T 180 65 T 260 85 T 340 45" 
          fill="none" stroke="#262626" stroke-width="2"/>

    <!-- Active Flowing Orange Sparkline Stream -->
    <path d="M 20 120 Q 60 100, 100 110 T 180 65 T 260 85 T 340 45" 
          fill="none" stroke="url(#p1-sparkline)" stroke-width="2.5" stroke-linecap="round" class="sparkline-stream"/>

    <!-- Endpoint Beacon -->
    <circle cx="340" cy="45" r="4.5" fill="#080808" stroke="#FF6A1F" stroke-width="2" class="p1-beacon"/>
    <circle cx="340" cy="45" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
