<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" width="100%" height="100%" fill="none">
  <defs>
    <!-- Modern Dark Glassmorphic Studio Surface -->
    <linearGradient id="modern-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>

    <!-- Subtle Orange Accent Ambient Lighting -->
    <radialGradient id="orange-spotlight" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FF6A1F" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#FF6A1F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="modern-thread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1F" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#FF6A1F" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#FFA066" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF6A1F" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Clean Precision Grid -->
    <pattern id="modern-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1A1A1A" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }

      @keyframes modernThreadMove {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes livePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #FF6A1F); opacity: 0.8; }
        50% { transform: scale(1.3); filter: drop-shadow(0 0 8px #FFA066); opacity: 1; }
      }

      .flow-thread {
        stroke-dasharray: 220 500;
        animation: modernThreadMove 5.5s linear infinite;
      }

      .pulse-dot-beacon {
        animation: livePulse 2.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="940" height="280" rx="14" fill="url(#modern-bg)"/>
  <rect width="940" height="280" rx="14" fill="url(#orange-spotlight)"/>
  <rect width="940" height="280" rx="14" fill="url(#modern-grid)"/>
  <rect width="938" height="278" x="1" y="1" rx="13" fill="none" stroke="#222222" stroke-width="1.2"/>

  <!-- Top System Telemetry Bar -->
  <g transform="translate(42, 34)">
    <circle cx="6" cy="0" r="4.5" fill="#FF6A1F" class="pulse-dot-beacon"/>
    <circle cx="6" cy="0" r="1.8" fill="#FFFFFF"/>
    <text x="20" y="4" fill="#A1A1A1" font-size="10.5" font-weight="600" letter-spacing="1.5" class="font-mono">NITIN SHAH // DIGITAL PORTFOLIO</text>
    <text x="856" y="4" text-anchor="end" fill="#666666" font-size="9.5" letter-spacing="1.2" class="font-mono">SYS: 2026.PRO // READY</text>
  </g>

  <!-- Divider Line -->
  <line x1="42" y1="52" x2="898" y2="52" stroke="#1C1C1C" stroke-width="1"/>

  <!-- Subtle Intelligent Orange Thread Moving Across Background -->
  <path d="M 50 145 C 180 145, 240 85, 380 85 C 520 85, 580 195, 720 195 C 800 195, 840 140, 890 140" 
        fill="none" stroke="#161616" stroke-width="2"/>
  <path d="M 50 145 C 180 145, 240 85, 380 85 C 520 85, 580 195, 720 195 C 800 195, 840 140, 890 140" 
        fill="none" stroke="url(#modern-thread)" stroke-width="2.2" class="flow-thread" stroke-linecap="round" filter="url(#soft-glow)"/>

  <!-- Left: Avatar Ring & Status -->
  <g transform="translate(50, 80)">
    <!-- Outer Glow Ring -->
    <circle cx="50" cy="50" r="48" fill="#141414" stroke="#262626" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="44" fill="none" stroke="#FF6A1F" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
    
    <!-- Avatar Embedded Image Clip -->
    <clipPath id="avatar-clip">
      <circle cx="50" cy="50" r="40"/>
    </clipPath>
    <image href="https://avatars.githubusercontent.com/u/108343714?v=4" x="10" y="10" width="80" height="80" clip-path="url(#avatar-clip)"/>
  </g>

  <!-- Right: Clean Typography & Modern Vibe Positioning -->
  <g transform="translate(175, 100)">
    <!-- Main Name Heading -->
    <text x="0" y="0" fill="#F5F5F0" font-size="34" font-weight="700" letter-spacing="-0.5" class="font-sans">NITIN SHAH</text>
    
    <!-- Modern Orange Tag -->
    <rect x="235" y="-22" width="220" height="26" rx="5" fill="#161616" stroke="#FF6A1F" stroke-width="1.2"/>
    <text x="345" y="-5" text-anchor="middle" fill="#FF6A1F" font-size="10.5" font-weight="700" letter-spacing="1.2" class="font-mono">AI &amp; FULL-STACK SYSTEMS</text>

    <!-- Subtitle Line -->
    <text x="0" y="28" fill="#A1A1A1" font-size="14" font-weight="400" letter-spacing="0.2" class="font-sans">
      Building scalable full-stack web platforms, agentic workflows, and high-throughput digital systems.
    </text>

    <!-- Modern Feature Tags Strip -->
    <g transform="translate(0, 52)">
      <!-- Tag 1: Next.js & React -->
      <rect width="130" height="24" rx="4" fill="#141414" stroke="#262626"/>
      <text x="65" y="16" text-anchor="middle" fill="#E5E5E5" font-size="10" font-weight="600" class="font-mono">Next.js 14 · React</text>

      <!-- Tag 2: GenAI & RAG -->
      <rect x="140" width="130" height="24" rx="4" fill="#141414" stroke="#262626"/>
      <text x="205" y="16" text-anchor="middle" fill="#E5E5E5" font-size="10" font-weight="600" class="font-mono">GenAI · LangGraph</text>

      <!-- Tag 3: Cloud & Backend -->
      <rect x="280" width="140" height="24" rx="4" fill="#141414" stroke="#262626"/>
      <text x="350" y="16" text-anchor="middle" fill="#E5E5E5" font-size="10" font-weight="600" class="font-mono">Firebase · FastAPI</text>

      <!-- Tag 4: Live Status -->
      <rect x="430" width="165" height="24" rx="4" fill="#181410" stroke="#FF6A1F" stroke-width="1.2"/>
      <circle cx="445" cy="12" r="3.5" fill="#FF6A1F" class="pulse-dot-beacon"/>
      <text x="525" y="16" text-anchor="middle" fill="#FFA066" font-size="10" font-weight="700" class="font-mono">OPEN FOR 2026 ROLES</text>
    </g>
  </g>

  <!-- Bottom Coordinate Tag -->
  <g transform="translate(896, 255)">
    <text x="0" y="0" text-anchor="end" fill="#555555" font-size="9.5" letter-spacing="1" class="font-mono">NEW DELHI, INDIA · UTC +05:30</text>
  </g>
</svg>
