<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 85" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ft-v2-thread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1F" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FF6A1F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFA066" stop-opacity="0.9"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      
      @keyframes ftDrawV2 {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }

      .ft-v2-anim {
        stroke-dasharray: 180 500;
        animation: ftDrawV2 6s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Grid Line -->
  <line x1="40" y1="42" x2="880" y2="42" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <!-- Active Animated Orange Thread -->
  <line x1="40" y1="42" x2="880" y2="42" stroke="url(#ft-v2-thread)" stroke-width="2.5" class="ft-v2-anim" stroke-linecap="round"/>

  <!-- Left Origin: BUILD -->
  <g transform="translate(50, 42)">
    <circle cx="0" cy="0" r="4" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="1.8"/>
    <text x="12" y="4" fill="#A1A1A1" font-size="9.5" font-weight="700" letter-spacing="1" class="font-mono">BUILD</text>
  </g>

  <!-- Mid Node 1: SHIP -->
  <g transform="translate(240, 42)">
    <circle cx="0" cy="0" r="3.5" fill="#0A0A0A" stroke="#444444" stroke-width="1.5"/>
    <text x="10" y="4" fill="#666666" font-size="9" font-weight="600" letter-spacing="1" class="font-mono">SHIP</text>
  </g>

  <!-- Mid Node 2: LEARN -->
  <g transform="translate(420, 42)">
    <circle cx="0" cy="0" r="3.5" fill="#0A0A0A" stroke="#444444" stroke-width="1.5"/>
    <text x="10" y="4" fill="#666666" font-size="9" font-weight="600" letter-spacing="1" class="font-mono">LEARN</text>
  </g>

  <!-- Center Arrow Signature -> Points to "LET'S BUILD SOMETHING USEFUL" -->
  <g transform="translate(630, 42)">
    <path d="M 0 -7 L 8 0 L 0 7" fill="none" stroke="#FF6A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="4.5" fill="#FF6A1F" font-size="10.5" font-weight="700" letter-spacing="1.5" class="font-mono">LET'S BUILD SOMETHING USEFUL &gt;&gt;</text>
  </g>

  <!-- Right End Node -->
  <circle cx="875" cy="42" r="3" fill="#333333"/>
</svg>
