<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 70" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>

    <!-- Animated Border Scan -->
    <linearGradient id="sb-border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="50%" stop-color="#FF6A1F"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      @keyframes sbPulse {
        0%, 100% { transform: scale(0.9); opacity: 0.5; filter: drop-shadow(0 0 1px #FF6A1F); }
        50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 6px #FF6A1F); }
      }

      @keyframes sbScan {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }

      .status-pulse {
        animation: sbPulse 2.5s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .border-scan {
        stroke-dasharray: 140 500;
        animation: sbScan 6s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="940" height="70" rx="8" fill="url(#sb-bg)"/>
  <rect width="938" height="68" x="1" y="1" rx="7" fill="none" stroke="#242424" stroke-width="1"/>
  <rect width="938" height="68" x="1" y="1" rx="7" fill="none" stroke="url(#sb-border-glow)" stroke-width="1.2" class="border-scan"/>

  <!-- Left: Availability & Current Building Status -->
  <g transform="translate(30, 35)">
    <circle cx="0" cy="0" r="4.5" fill="#FF6A1F" class="status-pulse"/>
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF"/>
    <text x="14" y="4" fill="#F5F5F0" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">AVAILABLE</text>
    <text x="115" y="4" fill="#666666" font-size="11" class="font-mono">|</text>
    <text x="135" y="4" fill="#A1A1A1" font-size="11.5" class="font-sans">Building Production AI &amp; Full-Stack Systems</text>
  </g>

  <!-- Middle: Location & Timezone -->
  <g transform="translate(575, 35)">
    <text x="0" y="4" fill="#666666" font-size="11" class="font-mono">LOC: <tspan fill="#A1A1A1">INDIA</tspan> · <tspan fill="#666666">UTC+05:30</tspan></text>
  </g>

  <!-- Right: Core Focus Vector -->
  <g transform="translate(745, 35)">
    <text x="0" y="4" fill="#FF6A1F" font-size="10.5" font-weight="700" letter-spacing="1" class="font-mono">FOCUS → AI · FULL-STACK</text>
  </g>
</svg>
