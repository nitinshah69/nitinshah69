<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>

    <linearGradient id="lp-active-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1F" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FF6A1F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFA066" stop-opacity="0.8"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      @keyframes lpPathFlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes focusBeacon {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #FF6A1F); }
        50% { transform: scale(1.25); filter: drop-shadow(0 0 10px #FFA066); }
      }

      .path-pulse-stream {
        stroke-dasharray: 80 250;
        animation: lpPathFlow 4.5s linear infinite;
      }

      .beacon-node {
        animation: focusBeacon 2.5s ease-in-out infinite;
        transform-origin: 410px 95px;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="920" height="180" rx="10" fill="url(#lp-bg)"/>
  <rect width="918" height="178" x="1" y="1" rx="9" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- Top Title Bar -->
  <g transform="translate(35, 32)">
    <text x="0" y="0" fill="#F5F5F0" font-size="12" font-weight="700" letter-spacing="1.5" class="font-mono">MY 2026 PATH // ACTIVE EVOLUTION PIPELINE</text>
    <text x="850" y="0" text-anchor="end" fill="#666666" font-size="9.5" class="font-mono">LIVE MILESTONES</text>
  </g>

  <!-- Connecting Track -->
  <line x1="50" y1="95" x2="870" y2="95" stroke="#222222" stroke-width="2"/>
  <line x1="50" y1="95" x2="410" y2="95" stroke="#FF6A1F" stroke-width="2"/>
  <line x1="50" y1="95" x2="870" y2="95" stroke="url(#lp-active-pulse)" stroke-width="2.5" class="path-pulse-stream" stroke-linecap="round"/>

  <!-- Node 1: FOUNDATIONS (COMPLETED) -->
  <g transform="translate(70, 95)">
    <circle cx="0" cy="0" r="6" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="2"/>
    <path d="M -3 0 L -1 2 L 3 -2" stroke="#FF6A1F" stroke-width="1.5" fill="none"/>
    <text x="0" y="24" text-anchor="middle" fill="#A1A1A1" font-size="10.5" font-weight="600" class="font-sans">FOUNDATIONS</text>
    <text x="0" y="38" text-anchor="middle" fill="#555555" font-size="8.5" class="font-mono">CS &amp; Data Struct</text>
  </g>

  <!-- Node 2: FULL STACK (COMPLETED) -->
  <g transform="translate(230, 95)">
    <circle cx="0" cy="0" r="6" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="2"/>
    <path d="M -3 0 L -1 2 L 3 -2" stroke="#FF6A1F" stroke-width="1.5" fill="none"/>
    <text x="0" y="24" text-anchor="middle" fill="#A1A1A1" font-size="10.5" font-weight="600" class="font-sans">FULL STACK</text>
    <text x="0" y="38" text-anchor="middle" fill="#555555" font-size="8.5" class="font-mono">Next.js, SQL, Node</text>
  </g>

  <!-- Node 3: GENERATIVE AI (ACTIVE FOCUS - BEACON ANIMATION) -->
  <g transform="translate(410, 95)">
    <circle cx="0" cy="0" r="8" fill="#FF6A1F" stroke="#FFFFFF" stroke-width="2" class="beacon-node"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    <text x="0" y="-16" text-anchor="middle" fill="#FF6A1F" font-size="9" font-weight="700" letter-spacing="1" class="font-mono">[ CURRENT FOCUS ]</text>
    <text x="0" y="24" text-anchor="middle" fill="#FFA066" font-size="11" font-weight="700" class="font-sans">GENERATIVE AI</text>
    <text x="0" y="38" text-anchor="middle" fill="#A1A1A1" font-size="8.5" class="font-mono">LLMs, RAG, Vectors</text>
  </g>

  <!-- Node 4: AGENTIC SYSTEMS (IN PROGRESS) -->
  <g transform="translate(580, 95)">
    <circle cx="0" cy="0" r="6" fill="#141414" stroke="#777777" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#777777"/>
    <text x="0" y="24" text-anchor="middle" fill="#E5E5E5" font-size="10.5" font-weight="600" class="font-sans">AGENTIC SYSTEMS</text>
    <text x="0" y="38" text-anchor="middle" fill="#666666" font-size="8.5" class="font-mono">Tool Calling, LangGraph</text>
  </g>

  <!-- Node 5: PRODUCTION AI (UPCOMING) -->
  <g transform="translate(740, 95)">
    <circle cx="0" cy="0" r="5" fill="#101010" stroke="#444444" stroke-width="1.5"/>
    <text x="0" y="24" text-anchor="middle" fill="#777777" font-size="10.5" font-weight="600" class="font-sans">PRODUCTION AI</text>
    <text x="0" y="38" text-anchor="middle" fill="#555555" font-size="8.5" class="font-mono">Observability &amp; Latency</text>
  </g>

  <!-- Node 6: REAL PRODUCTS (FUTURE) -->
  <g transform="translate(860, 95)">
    <circle cx="0" cy="0" r="5" fill="#101010" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="24" text-anchor="middle" fill="#555555" font-size="10.5" font-weight="600" class="font-sans">SCALE</text>
    <text x="0" y="38" text-anchor="middle" fill="#444444" font-size="8.5" class="font-mono">Autonomous SaaS</text>
  </g>
</svg>
