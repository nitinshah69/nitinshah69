<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ct-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>

    <linearGradient id="sig-orange-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1F" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FF6A1F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF7A26" stop-opacity="0.8"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      @keyframes signalFlow {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes cellPulseA { 0%, 100% { fill: #1C1C1C; } 25% { fill: #FF6A1F; } }
      @keyframes cellPulseB { 0%, 100% { fill: #1C1C1C; } 50% { fill: #FF6A1F; } }
      @keyframes cellPulseC { 0%, 100% { fill: #1C1C1C; } 75% { fill: #FF7A26; } }

      .active-signal-thread {
        stroke-dasharray: 180 500;
        animation: signalFlow 6s linear infinite;
      }

      .pulse-cell-1 { animation: cellPulseA 6s ease-in-out infinite; }
      .pulse-cell-2 { animation: cellPulseB 6s ease-in-out infinite; }
      .pulse-cell-3 { animation: cellPulseC 6s ease-in-out infinite; }
    </style>
  </defs>

