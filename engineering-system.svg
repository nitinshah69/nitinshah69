<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="es-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      @keyframes packetPulseFlow {
        0% { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes hubGlowBreathing {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px rgba(255, 106, 31, 0.4)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 12px rgba(255, 122, 38, 0.85)); }
      }

      .packet-link {
        stroke-dasharray: 20 120;
        animation: packetPulseFlow 3s linear infinite;
      }

      .packet-link-fast {
        stroke-dasharray: 25 100;
        animation: packetPulseFlow 2.4s linear infinite;
      }

      .pulse-hub-core {
        animation: hubGlowBreathing 4s ease-in-out infinite;
        transform-origin: 480px 165px;
      }
    </style>
  </defs>

  <!-- Base Plate -->
  <rect width="960" height="310" rx="10" fill="url(#es-bg)"/>
  <rect width="958" height="308" x="1" y="1" rx="9" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- Top Title -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" fill="#F4F1EA" font-size="12" font-weight="700" letter-spacing="1.5" class="font-mono">ENGINEERING SYSTEM // ARCHITECTURAL DEPENDENCY CONSTELLATION</text>
    <text x="880" y="0" text-anchor="end" fill="#8A8A8A" font-size="9.5" class="font-mono">SYSTEM TOPOLOGY</text>
  </g>

  <!-- Static Track Lines -->
  <line x1="480" y1="165" x2="270" y2="95" stroke="#222222" stroke-width="1.5"/>
  <line x1="270" y1="95" x2="130" y2="150" stroke="#1F1F1F" stroke-width="1.2"/>
  <line x1="480" y1="165" x2="160" y2="240" stroke="#222222" stroke-width="1.2"/>
  <line x1="480" y1="165" x2="330" y2="245" stroke="#222222" stroke-width="1.5"/>
  <line x1="480" y1="165" x2="630" y2="245" stroke="#222222" stroke-width="1.5"/>
  <line x1="630" y1="245" x2="800" y2="240" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="480" y1="165" x2="690" y2="95" stroke="#222222" stroke-width="1.5"/>
  <line x1="690" y1="95" x2="830" y2="150" stroke="#1F1F1F" stroke-width="1.2"/>
  <line x1="480" y1="165" x2="480" y2="70" stroke="#222222" stroke-width="1.5"/>

  <!-- Animated Moving Data Packets in Orange -->
  <line x1="480" y1="165" x2="270" y2="95" stroke="#FF6A1F" stroke-width="2" class="packet-link"/>
  <line x1="480" y1="165" x2="690" y2="95" stroke="#FF6A1F" stroke-width="2" class="packet-link-fast"/>
  <line x1="480" y1="165" x2="330" y2="245" stroke="#FF6A1F" stroke-width="2" class="packet-link"/>
  <line x1="480" y1="165" x2="630" y2="245" stroke="#FF6A1F" stroke-width="2" class="packet-link-fast"/>
  <line x1="480" y1="165" x2="480" y2="70" stroke="#FFA066" stroke-width="2" class="packet-link"/>
  <line x1="270" y1="95" x2="130" y2="150" stroke="#FFA066" stroke-width="1.5" class="packet-link"/>
  <line x1="690" y1="95" x2="830" y2="150" stroke="#FFA066" stroke-width="1.5" class="packet-link"/>

  <!-- Center Hub: [ AI / FULL-STACK ] -->
  <g transform="translate(480, 165)" class="pulse-hub-core">
    <circle cx="0" cy="0" r="42" fill="#141414" stroke="#FF6A1F" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#FF6A1F" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <text x="0" y="-5" text-anchor="middle" fill="#F4F1EA" font-size="11" font-weight="700" class="font-mono">AI / FULL-STACK</text>
    <text x="0" y="10" text-anchor="middle" fill="#FF7A26" font-size="9" font-weight="600" class="font-mono">CORE HUB</text>
  </g>

  <!-- Surrounding Nodes -->
  <g transform="translate(270, 95)">
    <circle cx="0" cy="0" r="24" fill="#151515" stroke="#FF6A1F" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#F4F1EA" font-size="9" font-weight="700" class="font-mono">Next.js</text>
  </g>

  <g transform="translate(130, 150)">
    <circle cx="0" cy="0" r="22" fill="#121212" stroke="#444444" stroke-width="1.2"/>
    <text x="0" y="3" text-anchor="middle" fill="#8A8A8A" font-size="8.5" font-weight="600" class="font-mono">React</text>
  </g>

  <g transform="translate(160, 240)">
    <circle cx="0" cy="0" r="22" fill="#121212" stroke="#444444" stroke-width="1.2"/>
    <text x="0" y="3" text-anchor="middle" fill="#8A8A8A" font-size="8.5" font-weight="600" class="font-mono">TypeScript</text>
  </g>

  <g transform="translate(330, 245)">
    <circle cx="0" cy="0" r="24" fill="#151515" stroke="#FF6A1F" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#F4F1EA" font-size="9" font-weight="700" class="font-mono">FastAPI</text>
  </g>

  <g transform="translate(480, 70)">
    <circle cx="0" cy="0" r="24" fill="#151515" stroke="#FF7A26" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#FF7A26" font-size="9" font-weight="700" class="font-mono">Agents</text>
  </g>

  <g transform="translate(690, 95)">
    <circle cx="0" cy="0" r="24" fill="#151515" stroke="#FF6A1F" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#F4F1EA" font-size="9" font-weight="700" class="font-mono">LLMs</text>
  </g>

  <g transform="translate(830, 150)">
    <circle cx="0" cy="0" r="22" fill="#121212" stroke="#444444" stroke-width="1.2"/>
    <text x="0" y="3" text-anchor="middle" fill="#8A8A8A" font-size="8.5" font-weight="600" class="font-mono">RAG</text>
  </g>

  <g transform="translate(630, 245)">
    <circle cx="0" cy="0" r="24" fill="#151515" stroke="#FF6A1F" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#F4F1EA" font-size="9" font-weight="700" class="font-mono">Postgres</text>
  </g>

  <g transform="translate(800, 240)">
    <circle cx="0" cy="0" r="22" fill="#121212" stroke="#444444" stroke-width="1.2"/>
    <text x="0" y="3" text-anchor="middle" fill="#8A8A8A" font-size="8.5" font-weight="600" class="font-mono">Docker</text>
  </g>
</svg>
