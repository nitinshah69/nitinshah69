      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      @keyframes signalWave {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes cellGlow1 { 0%, 100% { fill: #1C1C1C; } 25% { fill: #FF6A1F; } }
      @keyframes cellGlow2 { 0%, 100% { fill: #1C1C1C; } 50% { fill: #FF6A1F; } }
      @keyframes cellGlow3 { 0%, 100% { fill: #1C1C1C; } 75% { fill: #FF6A1F; } }

      .contrib-thread {
        stroke-dasharray: 180 500;
        animation: signalWave 6s linear infinite;
      }

      .cell-act-1 { animation: cellGlow1 6s ease-in-out infinite; }
      .cell-act-2 { animation: cellGlow2 6s ease-in-out infinite; }
      .cell-act-3 { animation: cellGlow3 6s ease-in-out infinite; }
